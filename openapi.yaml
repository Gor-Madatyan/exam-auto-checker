openapi: 3.1.0
info:
  title: jev-exam-scoring
  description: 'Automated exam scoring backed by the jev scoring backend (via OpenRouter).
    One endpoint group per scoring domain: code, essay, fact, pseudocode. Each domain
    exposes a single /check endpoint returning per-criterion noul floats in [0, 1],
    the derived 0-2 score (criteria joined with coefficients), and points_given. Every
    endpoint requires an X-API-Key header.'
  version: 0.1.0
paths:
  /api/v1/code/check:
    post:
      tags:
      - code
      summary: Code checks + derived score
      description: Score student source code against a reference solution. Returns
        per-criterion floats in [0, 1] (compiles_and_runs, correct_algorithm, handles_edge_cases)
        plus the derived code_score on the 0-2 scale (compiles_and_runs * 0.2 + correct_algorithm
        * 0.5 + handles_edge_cases * 0.3, remapped to 0-2 through the dense_power
        curve) and points_given. Fail the submission if compiles_and_runs < 0.5 or
        correct_algorithm < 0.5.
      operationId: check_code_endpoint_api_v1_code_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeChecks'
        '401':
          description: Invalid or missing X-API-Key.
        '500':
          description: Server misconfigured (API_KEY / OPENROUTER_API_KEY missing).
        '502':
          description: Scoring backend (OpenRouter/jev) unavailable.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /api/v1/essay/check:
    post:
      tags:
      - essay
      summary: Essay checks + derived score
      description: Score a student essay against the topic and requirements. Returns
        meets_requirements and grammatically_correct floats in [0, 1] plus the derived
        essay_score on the 0-2 scale (grammatically_correct * 0.6 + meets_requirements
        * 0.4, remapped to 0-2 through the dense_power curve) and points_given.
      operationId: check_essay_endpoint_api_v1_essay_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EssayCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EssayChecks'
        '401':
          description: Invalid or missing X-API-Key.
        '500':
          description: Server misconfigured (API_KEY / OPENROUTER_API_KEY missing).
        '502':
          description: Scoring backend (OpenRouter/jev) unavailable.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /api/v1/fact/check:
    post:
      tags:
      - fact
      summary: Fact checks + derived score
      description: Grade a factual answer against the correct answer. Returns per-criterion
        floats in [0, 1] (factually_correct, complete, answers_question) plus the
        derived fact_score on the 0-2 scale (factually_correct * 0.5 + complete *
        0.3 + answers_question * 0.2, remapped to 0-2 through the dense_power curve)
        and points_given.
      operationId: check_fact_endpoint_api_v1_fact_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactChecks'
        '401':
          description: Invalid or missing X-API-Key.
        '500':
          description: Server misconfigured (API_KEY / OPENROUTER_API_KEY missing).
        '502':
          description: Scoring backend (OpenRouter/jev) unavailable.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /api/v1/pseudocode/check:
    post:
      tags:
      - pseudocode
      summary: Pseudocode checks + derived score
      description: Score student pseudocode against a reference. Returns per-criterion
        floats in [0, 1] (clear_and_complete, correct_algorithm, handles_edge_cases)
        plus the derived pseudocode_score on the 0-2 scale (clear_and_complete * 0.2
        + correct_algorithm * 0.5 + handles_edge_cases * 0.3, remapped to 0-2 through
        the dense_power curve) and points_given. Fail the submission if clear_and_complete
        < 0.5 or correct_algorithm < 0.5.
      operationId: check_pseudocode_endpoint_api_v1_pseudocode_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PseudocodeCheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PseudocodeChecks'
        '401':
          description: Invalid or missing X-API-Key.
        '500':
          description: Server misconfigured (API_KEY / OPENROUTER_API_KEY missing).
        '502':
          description: Scoring backend (OpenRouter/jev) unavailable.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
components:
  schemas:
    CodeCheckRequest:
      properties:
        student_code:
          type: string
          minLength: 1
          title: Student Code
        correct_code:
          type: string
          minLength: 1
          title: Correct Code
        question_description:
          type: string
          minLength: 1
          title: Question Description
        max_points:
          type: number
          exclusiveMinimum: 0.0
          title: Max Points
      type: object
      required:
      - student_code
      - correct_code
      - question_description
      - max_points
      title: CodeCheckRequest
    CodeChecks:
      properties:
        compiles_and_runs:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Compiles And Runs
        correct_algorithm:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Correct Algorithm
        handles_edge_cases:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Handles Edge Cases
        code_score:
          type: number
          maximum: 2.0
          minimum: 0.0
          title: Code Score
        points_given:
          type: number
          minimum: 0.0
          title: Points Given
      type: object
      required:
      - compiles_and_runs
      - correct_algorithm
      - handles_edge_cases
      - code_score
      - points_given
      title: CodeChecks
    EssayCheckRequest:
      properties:
        student_essay:
          type: string
          minLength: 1
          title: Student Essay
        topic:
          type: string
          minLength: 1
          title: Topic
        requirements:
          type: string
          title: Requirements
          default: ''
        max_points:
          type: number
          exclusiveMinimum: 0.0
          title: Max Points
      type: object
      required:
      - student_essay
      - topic
      - max_points
      title: EssayCheckRequest
    EssayChecks:
      properties:
        meets_requirements:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Meets Requirements
        grammatically_correct:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Grammatically Correct
        essay_score:
          type: number
          maximum: 2.0
          minimum: 0.0
          title: Essay Score
        points_given:
          type: number
          minimum: 0.0
          title: Points Given
      type: object
      required:
      - meets_requirements
      - grammatically_correct
      - essay_score
      - points_given
      title: EssayChecks
    FactCheckRequest:
      properties:
        student_answer:
          type: string
          minLength: 1
          title: Student Answer
        correct_answer:
          type: string
          minLength: 1
          title: Correct Answer
        question_description:
          type: string
          minLength: 1
          title: Question Description
        max_points:
          type: number
          exclusiveMinimum: 0.0
          title: Max Points
      type: object
      required:
      - student_answer
      - correct_answer
      - question_description
      - max_points
      title: FactCheckRequest
    FactChecks:
      properties:
        factually_correct:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Factually Correct
        complete:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Complete
        answers_question:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Answers Question
        fact_score:
          type: number
          maximum: 2.0
          minimum: 0.0
          title: Fact Score
        points_given:
          type: number
          minimum: 0.0
          title: Points Given
      type: object
      required:
      - factually_correct
      - complete
      - answers_question
      - fact_score
      - points_given
      title: FactChecks
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PseudocodeCheckRequest:
      properties:
        student_pseudocode:
          type: string
          minLength: 1
          title: Student Pseudocode
        correct_pseudocode:
          type: string
          minLength: 1
          title: Correct Pseudocode
        question_description:
          type: string
          minLength: 1
          title: Question Description
        max_points:
          type: number
          exclusiveMinimum: 0.0
          title: Max Points
      type: object
      required:
      - student_pseudocode
      - correct_pseudocode
      - question_description
      - max_points
      title: PseudocodeCheckRequest
    PseudocodeChecks:
      properties:
        clear_and_complete:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Clear And Complete
        correct_algorithm:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Correct Algorithm
        handles_edge_cases:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Handles Edge Cases
        pseudocode_score:
          type: number
          maximum: 2.0
          minimum: 0.0
          title: Pseudocode Score
        points_given:
          type: number
          minimum: 0.0
          title: Points Given
      type: object
      required:
      - clear_and_complete
      - correct_algorithm
      - handles_edge_cases
      - pseudocode_score
      - points_given
      title: PseudocodeChecks
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Backend API key (server API_KEY env). Required on every endpoint.
      in: header
      name: X-API-Key
tags:
- name: code
  description: Source-code answer scoring (compiles/runs, algorithm, edge cases).
- name: essay
  description: Free-text essay scoring (requirements, grammar).
- name: fact
  description: Short factual-answer scoring, graded directly to points.
- name: pseudocode
  description: Pseudocode answer scoring (clarity, algorithm, edge cases).
